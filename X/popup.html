<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Vastra Extension</title>
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #111b21;
      margin: 0;
    }
    h3 {
      font-size: 14px;
      margin-top: 0;
      margin-bottom: 8px;
      color: #00a884;
    }
    label {
      font-size: 11px;
      font-weight: 600;
      color: #667781;
      display: block;
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #e9edef;
      border-radius: 6px;
      font-size: 12px;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 8px;
      background-color: #00a884;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background-color: #008f70;
    }
    #status {
      font-size: 11px;
      color: #2e7d32;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h3>AI Vastra CRM Extension</h3>
  <label for="apiUrl">Server API URL</label>
  <input type="text" id="apiUrl" value="https://crm.nicedigitalsgroup.com" placeholder="https://crm.nicedigitalsgroup.com" />
  <button id="saveBtn">Save Settings</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
