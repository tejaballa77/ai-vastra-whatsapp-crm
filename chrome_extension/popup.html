<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      padding: 16px;
      margin: 0;
      background: #111b21;
      color: #e9edef;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #00a884;
    }
    .status {
      font-size: 12px;
      color: #8696a0;
      line-height: 1.5;
    }
    .btn {
      display: block;
      width: 100%;
      background: #00a884;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 14px;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
    }
    .btn:hover {
      background: #008f70;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">AI Vastra CRM Overlay</div>
    <span style="background: rgba(0,168,132,0.2); color: #00a884; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700;">v1.0</span>
  </div>
  <div class="status">
    Extension active on <strong>web.whatsapp.com</strong>.<br>
    Open WhatsApp Web to access Lead Drawer, Auto-Responder & AI Smart Replies.
  </div>
  <a href="https://web.whatsapp.com" target="_blank" class="btn">Open WhatsApp Web</a>
</body>
</html>
