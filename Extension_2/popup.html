<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Vastra Social CRM Config</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #fafafa;
      color: #111827;
      margin: 0;
    }
    h2 {
      font-size: 15px;
      font-weight: 800;
      margin: 0 0 4px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    p {
      font-size: 11px;
      color: #6b7280;
      margin: 0 0 14px 0;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #374151;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
    }
    input:focus {
      border-color: #00a884;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #00a884;
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #008f70;
    }
    .status {
      margin-top: 10px;
      font-size: 11px;
      font-weight: 700;
      color: #059669;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2><span>⚡</span> AI Vastra Social CRM</h2>
  <p>Configure CRM server endpoint for Instagram, LinkedIn & Facebook</p>

  <div class="form-group">
    <label for="apiUrl">Backend Server URL</label>
    <input type="text" id="apiUrl" placeholder="http://localhost:5000" />
  </div>

  <button id="saveBtn">Save Configuration</button>

  <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #e5e7eb;">
    <button id="restoreBtn" style="background: #3b82f6;">🔄 Restore Floating AI CRM Button</button>
  </div>

  <div class="status" id="statusMsg"></div>

  <script src="popup.js"></script>
</body>
</html>
